audits:
  P-EVO-03:
    state: archive
    audit_class: non_quick_foundation
    source_note: >-
      Requires the full K-PF-01 primitive nonnegative-matrix Perron-Frobenius
      asymptotic package: positive left/right Perron vectors, spectral gap and
      normalized power convergence. Pinned Mathlib exposes Matrix.IsPrimitive
      definitions but no directly reusable complete asymptotic theorem was
      found. Do not weaken to an assumed-convergence surrogate.

  P-ALG-01:
    state: source_audit
    audit_class: medium_algorithmic
    source_note: >-
      Frozen section 28.5 requires the exact finite partition-refinement
      algorithm, finite termination, terminal controlled stability, coarsest
      stable refinement of the initial output/reward partition, preservation of
      output/reward/all-action one-step quotient laws, and induction to all
      corresponding finite-horizon output laws. Mathlib Finpartition/refinement
      infrastructure is available, but no complete UEOT implementation has been
      found. Floating-tolerance clustering is not an acceptable substitute.
