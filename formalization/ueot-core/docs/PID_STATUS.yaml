    state: source_audit
    source_locked: true
    proof_contract:
      assumptions: C=P(Y|H,U) discrete; H(C|U)<infinity; random encoder allowed
      conclusion: R_obj(0)=H(C|U)
      proof_route:
        - zero_TV_implies_C_recoverable_from_M_U
        - conditional_data_processing_lower_bound
        - attainability_by_M_equals_C
    reuse:
      - UEOT.V3.InformationCore
      - UEOT.V3.InformationDiscreteEntropy
      - UEOT.V3.InformationMemoryBound
      - UEOT.V3.InformationConditionalBinary as finite-disintegration design precedent
    audit_finding: >-
      Existing UEOT entropy infrastructure is unconditional. H(C|U) must be
      constructed by genuine disintegration for countable discrete C; defining
      it as H(C)-I(C;U) would add an unintended finite-H(C) assumption. The new
      P-INFO-04 binary conditional layer validates the intended disintegration
      architecture but is not yet the countable-discrete theorem P-INFO-03 needs.
    missing:
