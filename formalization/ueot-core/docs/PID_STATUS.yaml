    audit_class: conditional_path_irreducibility
    canonical_theorem: UEOT.V3.CompositionPathSource.p_comp_01
    source_contract:
      - one common joint probability law rho of the external interface U and all child paths
      - one canonical conditional joint path law rho.condKernel is used for every partition
      - explicit disintegration bridge rho.fst compProd rho.condKernel = rho preserves source-object identity
      - partitions are actual finite set partitions of the common child-index set
      - the exact margin ranges over the complete finite family of all nontrivial partitions
      - each partition reblocks the same path coordinates and no unrelated per-partition kernel is introduced
      - I_pi is conditional KL from the reblocked common joint law to the product of its conditional block marginals
      - I_pi = 0 iff the corresponding blocks are conditionally independent given U
      - the exact finite minimum is positive iff no nontrivial partition factorizes
    implementation_contract:
      - reblockPath and unReblockPath are explicit measurable inverses
      - block product kernel is constructed from measurable block-marginal probability kernels
      - fiber KL measurability is derived internally rather than exposed as a source-external hMeas premise
      - actual partition block labels are nonempty and partitionBlockOf is surjective
      - StandardBorel/nonempty hypotheses are confined to regular conditional probability/disintegration infrastructure
      - historically rejected unrelated-kernel-per-partition design is forbidden
