      - prove exact KL by klDiv_eq_lintegral_klFun_of_ac and A/Ac split
      - prove Bernoulli KL monotonicity for r >= p > q
      - prove the global infimum theorem over all feasible Q
      - clean-integrate only from latest full-green main
