  P-ID-02:
    state: proved
    source_locked: true
    source_semantic_audit: complete
    mathematical_chain: complete
    proof_contract:
      space: metric_or_pseudometric
      reference: thetaBar_(t+1)=Psi_t(thetaBar_t) under the same declared external inputs
      residual: d(theta_(t+1),Psi_t(theta_t)) <= epsilon_t
      lipschitz: Psi_t is L_t-Lipschitz with L_t >= 0
      recurrence: e_(t+1) <= L_t*e_t + epsilon_t
      finite_horizon: e_n <= product_(j<n) L_j * e_0 + sum_(k<n) epsilon_k * product_(j=k+1)^(n-1) L_j
      contraction_corollary: if L_t<=L<1 and epsilon_t<=epsilon then e_n<=L^n e_0 + epsilon*(1-L^n)/(1-L)
      scope_guard: differing actual/reference external inputs require an additional input-sensitivity error term and are not identified with the same-trajectory model
    canonical_theorems:
      recurrence: UEOT.V3.DevelopmentTransport.development_error_step
      finite_horizon: UEOT.V3.DevelopmentTransport.development_pipeline
      uniform_geometric: UEOT.V3.DevelopmentTransport.development_pipeline_uniform_geom
      contraction: UEOT.V3.DevelopmentTransport.development_pipeline_uniform_contraction
    promotion:
