  P-COMP-02:
    state: proved
    source_locked: true
    source_semantic_audit: complete
    audit_class: intervention_js_irreducibility
    canonical_theorems:
      - UEOT.V3.CompositionInterventionJS.jsDiv_mem_Icc_logTwo
      - UEOT.V3.CompositionInterventionJS.jsDiv_eq_zero_iff
      - UEOT.V3.CompositionInterventionJS.cutJSMargin_pos_iff
    source_contract:
      - original and implementable-cut record laws are probability measures on the same measurable record space
      - Jensen-Shannon divergence uses the actual midpoint law M = (P + Q) / 2
      - 0 <= JS(P,Q) <= log 2 for arbitrary source-scope probability record laws
      - JS(P,Q) = 0 iff P = Q
      - for a finite declared cut family the exact minimum JS is positive iff every declared cut changes the record law
      - zero observed cut effect alone does not imply absence of microscopic coupling
      - microscopic-decoupling interpretation requires additional observation-completeness or cut-faithfulness assumptions
    implementation_contract:
      - midpoint is constructed as the genuine half-scaled sum of the two probability measures
      - P <= 2M and Q <= 2M derive absolute continuity rather than assuming it
      - Radon-Nikodym densities are bounded by two almost everywhere from measure domination
      - KL-integrand integrability is established before ENNReal.toReal conversion
      - exact affine klFun bound on density interval [0,2] yields each KL-to-midpoint upper bound log 2
      - zero equivalence uses KL converse Gibbs and not a postulated JS axiom
      - no finite/discrete surrogate and no postulated KL or JS property
    promotion:
      feature_branch: formal/pcomp01-multiblock-v1
