    source_contract:
      - optimize over all probability laws Q absolutely continuous with respect to P0
      - constraint Q(A) >= p
      - q = P0(A) with 0 < q < 1
      - if p <= q then infimum 0 attained by P0
      - if p > q then infimum equals Bernoulli KL d_Bern(p||q)
      - explicit RN optimizer (p/q) 1_A + ((1-p)/(1-q)) 1_Ac
      - prove optimizer probability, AC, exact event mass and exact KL
      - retain p = 1 boundary with 0 log 0 convention
    implemented:
