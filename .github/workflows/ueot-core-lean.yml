name: UEOT Core Lean

on:
  push:
    branches: [main, "formal/**"]
    paths:
      - "formalization/ueot-core/**"
      - ".github/workflows/ueot-core-lean.yml"
  pull_request:
    paths:
      - "formalization/ueot-core/**"
      - ".github/workflows/ueot-core-lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization/ueot-core
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify pinned Lean
        run: |
          lean --version
          lake --version

      - name: Verify dependency lock exists
        run: test -s lake-manifest.json

      - name: Restore Mathlib cache from lock
        run: lake exe cache get

      - name: Build UEOT from lock
        shell: bash
        run: |
          set -o pipefail
          lake build UEOT 2>&1 | tee ueot-build.log

      - name: Upload Lean build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ueot-build-log
          path: formalization/ueot-core/ueot-build.log
          if-no-files-found: error