name: UEOT Core Lean

on:
  push:
    branches: [main]
    paths:
      - "formalization/ueot-core/**"
      - ".github/workflows/ueot-core-lean.yml"
  pull_request:
    paths:
      - "formalization/ueot-core/**"
      - ".github/workflows/ueot-core-lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization/ueot-core
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify pinned Lean
        run: |
          lean --version
          lake --version

      - name: Resolve pinned dependencies
        run: |
          lake update
          echo "===== BEGIN lake-manifest.json ====="
          cat lake-manifest.json
          echo "===== END lake-manifest.json ====="

      - name: Build UEOT
        run: lake build UEOT
