name: UEOT Core Lean

on:
  push:
    branches: [main]
    paths:
      - "formalization/ueot-core/**"
      - ".github/workflows/ueot-core-lean.yml"
  pull_request:
    paths:
      - "formalization/ueot-core/**"
      - ".github/workflows/ueot-core-lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization/ueot-core
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalization/ueot-core
          auto-config: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false

      - name: Resolve pinned dependencies
        run: ~/.elan/bin/lake update

      - name: Build UEOT
        run: ~/.elan/bin/lake build UEOT
