name: UEOT Core Lean

on:
  # Routine Core development is built locally before publication. Cloud full
  # builds remain an explicit operation on the selected ref.
  workflow_dispatch:

concurrency:
  group: ueot-core-lean-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization/ueot-core
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify pinned Lean
        run: |
          lean --version
          lake --version

      - name: Verify dependency lock exists
        run: test -s lake-manifest.json

      - name: Restore Mathlib cache from lock
        run: lake exe cache get

      - name: Build UEOT from lock
        run: lake build UEOT
