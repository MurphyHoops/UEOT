name: UEOT Core Compression Guard

on:
  push:
    branches: [main]
    paths:
      - "formalization/ueot-core/**"
      - "docs/REPOSITORY_BRANCH_GOVERNANCE.md"
      - ".github/workflows/ueot-core-compression.yml"
      - ".github/workflows/ueot-core-lean.yml"
  pull_request:
    paths:
      - "formalization/ueot-core/**"
      - "docs/REPOSITORY_BRANCH_GOVERNANCE.md"
      - ".github/workflows/ueot-core-compression.yml"
      - ".github/workflows/ueot-core-lean.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ueot-core-compression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      proof_required: ${{ steps.changes.outputs.proof_required }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify semantic blast radius
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$BASE_SHA"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            BASE="$BEFORE_SHA"
          else
            BASE="${HEAD_SHA}^"
          fi

          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$HEAD_SHA"
          git cat-file -e "${BASE}^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE"

          proof_required=false
          while IFS= read -r path; do
            case "$path" in
              formalization/ueot-core/UEOT.lean|formalization/ueot-core/UEOT/*.lean|formalization/ueot-core/UEOT/**/*.lean|formalization/ueot-core/scripts/*.lean|formalization/ueot-core/scripts/validate_compression.py|formalization/ueot-core/scripts/test_validate_compression.py|formalization/ueot-core/docs/compression/COMPRESSION_LEDGER.yaml|.github/workflows/ueot-core-compression.yml|formalization/ueot-core/lakefile.lean|formalization/ueot-core/lake-manifest.json|formalization/ueot-core/lean-toolchain)
                proof_required=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE" "$HEAD_SHA")
          echo "proof_required=$proof_required" >> "$GITHUB_OUTPUT"

  governance:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch main for baseline protection
        run: git fetch origin main:refs/remotes/origin/main

      - name: Reject proof escapes in compression namespace
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^[[:space:]]*(axiom|opaque)[[:space:]]|\b(sorry|admit|native_decide)\b' formalization/ueot-core/UEOT/V3/Compression; then
            echo "Forbidden proof escape found in compression namespace." >&2
            exit 1
          fi

      - name: Validate compression ledger and matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          COMPRESSION_VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          BASELINE_REF="origin/main"
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" && -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            BASELINE_REF="$BEFORE_SHA"
          fi
          python3 formalization/ueot-core/scripts/validate_compression.py \
            --repo-root . \
            --baseline-ref "$BASELINE_REF" \
            --verify-finalization-refs

      - name: Regression-test mission completion gates
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          COMPRESSION_VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 formalization/ueot-core/scripts/test_validate_compression.py --repo-root .
          python3 formalization/ueot-core/scripts/test_validate_finalization_receipt.py

      - name: Validate post-FINAL research ownership and architecture records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASELINE_REF="origin/main"
          BRANCH_NAME="${HEAD_REF:-$REF_NAME}"
          if [[ "$EVENT_NAME" == "pull_request" && -n "$BASE_SHA" ]]; then
            BASELINE_REF="$BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" && -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            BASELINE_REF="$BEFORE_SHA"
          fi
          git cat-file -e "${CANDIDATE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$CANDIDATE_SHA"
          python3 formalization/ueot-core/scripts/validate_compression_research.py \
            --repo-root . \
            --baseline-ref "$BASELINE_REF" \
            --candidate-ref "$CANDIDATE_SHA" \
            --branch-name "$BRANCH_NAME" \
            --head-repo "$HEAD_REPO" \
            --base-repo "$BASE_REPO" \
            --verify-live-state

      - name: Regression-test post-FINAL research governance
        run: python3 formalization/ueot-core/scripts/test_validate_compression_research.py --repo-root .

      - name: Verify unified mathematical closure mission and adversarial governance
        shell: bash
        run: |
          set -euo pipefail
          python3 formalization/ueot-core/docs/compression/theory_completion/unified_closure/validate_unified_closure.py --repo-root .
          python3 formalization/ueot-core/docs/compression/theory_completion/unified_closure/test_validate_unified_closure.py

      - name: Enforce FKRG source-derived knowledge index and reuse-contract regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile
          import unittest


          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()


          def is_authorized_ops_only_pr():
              # Main, research PRs, dispatches, and unknown contexts keep the complete
              # unmodified integration suite. No caller-provided skip switch is accepted.
              if os.environ.get('GITHUB_EVENT_NAME') != 'pull_request':
                  return False
              pr = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())['pull_request']
              base, head = pr['base']['sha'], pr['head']['sha']
              for rev in (base, head):
                  if not re.fullmatch('[0-9a-f]{40}', rev):
                      raise ValueError('Invalid immutable Git commit identity')
                  if git('rev-parse', rev + '^{commit}') != rev:
                      raise ValueError('Git identity does not resolve to the declared commit')
              policy_path = 'formalization/ueot-core/docs/compression/COMPRESSION_RESEARCH_TRACKS.json'
              policy = json.loads(git('show', base + ':' + policy_path))
              branch = pr['head']['ref']
              if not any(re.fullmatch(pattern, branch)
                         for pattern in policy['governance']['branch_patterns']):
                  return False

              # Execute the immutable base validator before considering the one TC-only
              # test inapplicable. Candidate policy or checker bytes cannot self-authorize.
              checker = 'formalization/ueot-core/scripts/validate_compression_research.py'
              with tempfile.TemporaryDirectory(prefix='ueot-fkrg-ops-authority-') as dirname:
                  authority = Path(dirname) / 'validate_compression_research.py'
                  authority.write_bytes(subprocess.check_output(['git', 'show', base + ':' + checker]))
                  subprocess.run([
                      sys.executable, str(authority), '--repo-root', '.',
                      '--baseline-ref', base, '--candidate-ref', head,
                      '--branch-name', branch,
                      '--head-repo', pr['head']['repo']['full_name'],
                      '--base-repo', pr['base']['repo']['full_name'],
                  ], check=True)

              paths = subprocess.check_output([
                  'git', 'diff', '--name-only', '--no-renames', '-z', base + '...' + head,
              ]).decode().split('\0')
              tc = policy['tracks']['TC']
              exact = set(tc['allowed_exact_paths'])
              prefixes = tuple(tc['allowed_path_prefixes'])
              return not any(path in exact or path.startswith(prefixes) for path in paths if path)


          def tests_in(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from tests_in(item)
                  else:
                      yield item


          def run_fkrg_tests():
              path = Path('formalization/ueot-core/docs/compression/theory_completion/knowledge/test_fkrg.py')
              if not is_authorized_ops_only_pr():
                  subprocess.run([sys.executable, str(path)], check=True)
                  return
              spec = importlib.util.spec_from_file_location('test_fkrg', path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              tests = list(tests_in(unittest.defaultTestLoader.loadTestsFromModule(module)))
              tc_scope_test = ('test_fkrg.UMCFastAuditIntegrationTests.'
                               'test_real_fast_audit_preserves_all_historical_receipts')
              if sum(test.id() == tc_scope_test for test in tests) != 1:
                  raise RuntimeError('Expected exactly one TC-only scope integration test')
              selected = unittest.TestSuite(test for test in tests if test.id() != tc_scope_test)
              print('Base-authorized ops-only PR: TC-only scope integration is inapplicable; '
                    'all other FKRG tests, including real source freshness, remain required.', flush=True)
              result = unittest.TextTestRunner(verbosity=2).run(selected)
              if not result.wasSuccessful():
                  raise SystemExit(1)


          if __name__ == '__main__':
              run_fkrg_tests()
          PYCODE


      - name: Mandatory base-authorized FKRG theorem reuse delta preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          event_name = os.environ['GITHUB_EVENT_NAME']
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          if event_name == 'pull_request':
              base = event['pull_request']['base']['sha']
              head = event['pull_request']['head']['sha']
              pr_number = int(event['pull_request']['number'])
          elif event_name == 'push':
              head = os.environ['GITHUB_SHA']
              base = event.get('before') or head
              if base == '0' * 40:
                  base = head
              pr_number = None
          else:
              base = head = os.environ['GITHUB_SHA']
              pr_number = None

          for rev in (base, head):
              if not re.fullmatch('[0-9a-f]{40}', rev):
                  raise ValueError('Invalid immutable Git commit identity')
              present = subprocess.run(['git', 'cat-file', '-e', rev + '^{commit}'],
                                       check=False).returncode == 0
              if not present:
                  source = ('refs/pull/' + str(pr_number) + '/head'
                            if rev == head and pr_number is not None else rev)
                  subprocess.run(['git', 'fetch', '--no-tags', 'origin', source],
                                 check=True)
                  subprocess.run(['git', 'cat-file', '-e', rev + '^{commit}'],
                                 check=True)

          # Compile/run the AUTHORITATIVE base-revision parser and regression
          # suite from an isolated Git worktree. The PR head may modify its
          # own scripts but those untrusted bytes cannot bypass this step.
          with tempfile.TemporaryDirectory(prefix='ueot-fkrg-authority-',
                                           dir=os.environ['RUNNER_TEMP']) as dirname:
              source_root = Path(dirname) / 'base'
              subprocess.run(['git', 'worktree', 'add', '--detach',
                              str(source_root), base], check=True)
              try:
                  path = Path('formalization/ueot-core/docs/compression/'
                              'theory_completion/knowledge/reuse')
                  subprocess.run(['python3', str(source_root / path /
                                                   'test_pr_preflight.py')],
                                 cwd=source_root, check=True)
                  subprocess.run([
                      'python3', str(source_root / path / 'pr_preflight.py'),
                      '--repo-root', os.environ['GITHUB_WORKSPACE'],
                      '--baseline-ref', base,
                      '--candidate-ref', head,
                      '--report', os.environ['RUNNER_TEMP'] +
                                  '/ueot-fkrg-new-theorems.json',
                      '--summary', os.environ['GITHUB_STEP_SUMMARY'],
                  ], cwd=source_root, check=True)
              finally:
                  subprocess.run(['git', 'worktree', 'remove', '--force',
                                  str(source_root)], check=True)
          PYCODE

      - name: Archive FKRG new-theorem reuse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ueot-fkrg-reuse-${{ github.run_id }}
          path: ${{ runner.temp }}/ueot-fkrg-new-theorems.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report actual validation scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          LOCAL_PROOF_REQUIRED: ${{ needs.classify.outputs.proof_required }}
        shell: bash
        run: |
          {
            echo "## UEOT Core validation scope"
            echo
            echo "- governance and source proof-escape checks: PASS"
            echo "- semantic changes require local proof evidence: ${LOCAL_PROOF_REQUIRED}"
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "- cloud Compression proof: requested; see the separate proof job result"
            else
              echo "- cloud Lean builds: NOT RUN (local development mode)"
              echo "- full cloud regression: manually dispatch UEOT Core Lean on the intended ref"
            fi
          } >> "$GITHUB_STEP_SUMMARY"


  proof:
    needs: [classify, governance]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization/ueot-core
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify pinned Lean
        run: |
          lean --version
          lake --version
          test -s lake-manifest.json

      - name: Restore Mathlib cache from lock
        run: lake exe cache get

      - name: Build compression meta-layer
        run: lake build UEOT.V3.Compression

      - name: Verify ledger witnesses and transitive axiom allowlist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          COMPRESSION_VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/validate_compression.py \
            --repo-root ../.. \
            --baseline-ref origin/main \
            --verify-finalization-refs \
            --emit-lean-witness-audit /tmp/CompressionLedgerWitnessAudit.lean
          lake env lean /tmp/CompressionLedgerWitnessAudit.lean
          python3 scripts/test_validate_compression.py --repo-root ../.. --lean-witness-controls-only

      - name: Print compression theorem axioms
        run: lake env lean scripts/CompressionAxiomAudit.lean

      - name: Compression evidence summary
        shell: bash
        run: |
          {
            echo "## UEOT Core Compression Guard"
            echo
            echo "- head: ${GITHUB_SHA}"
            echo "- matrix integrity: PASS"
            echo "- ledger validation: PASS"
            echo "- compression build: PASS"
            echo "- proof-escape scan: PASS"
            echo "- full UEOT regression: NOT RUN here; separate manual UEOT Core Lean workflow"
          } >> "$GITHUB_STEP_SUMMARY"
