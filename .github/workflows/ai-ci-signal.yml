name: UEOT AI CI Signal

on:
  workflow_run:
    workflows:
      - "UEOT AI Agent State Guard"
      - "UEOT Core Lean"
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: ueot-ai-signal-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  signal:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Emit one signal when task-required checks are settled
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const sha = run.head_sha;
            const prs = run.pull_requests || [];
            if (prs.length !== 1) {
              core.info(`Expected one PR for ${sha}; found ${prs.length}. No signal.`);
              return;
            }
            const prNumber = prs[0].number;

            const tree = await github.rest.git.getTree({
              owner,
              repo,
              tree_sha: sha,
              recursive: 'true',
            });
            const statePaths = tree.data.tree
              .filter((entry) => entry.type === 'blob' && /^\.ai\/tasks\/[^/]+\/STATE\.json$/.test(entry.path))
              .map((entry) => entry.path);

            let state = null;
            for (const path of statePaths) {
              const file = await github.rest.repos.getContent({ owner, repo, path, ref: sha });
              if (Array.isArray(file.data) || !('content' in file.data)) continue;
              const parsed = JSON.parse(Buffer.from(file.data.content, 'base64').toString('utf8'));
              if (parsed.open_pr === prNumber && parsed.branch === run.head_branch) {
                if (state !== null) {
                  core.setFailed(`More than one task state is bound to PR #${prNumber}.`);
                  return;
                }
                state = parsed;
              }
            }
            if (state === null) {
              core.info(`No persistent task state is bound to PR #${prNumber}; no signal.`);
              return;
            }

            const required = state.required_checks || [];
            if (!Array.isArray(required) || required.length === 0) {
              core.setFailed(`Task ${state.task_id} has no required_checks.`);
              return;
            }

            const checks = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: sha,
              per_page: 100,
            });

            const selected = [];
            for (const requiredName of required) {
              const matches = checks.filter((check) =>
                check.app?.slug === 'github-actions' && check.name === requiredName
              );
              if (matches.length === 0) {
                core.info(`Required check ${requiredName} is not visible yet; no signal.`);
                return;
              }
              if (matches.some((check) => check.status !== 'completed')) {
                core.info(`Required check ${requiredName} is still running; no signal.`);
                return;
              }
              selected.push(...matches);
            }

            const successConclusions = new Set(['success', 'neutral', 'skipped']);
            const aggregate = selected.every((check) => successConclusions.has(check.conclusion))
              ? 'success'
              : 'failure';
            const eventKey = `ci-settled:${sha}:${aggregate}`;
            const marker = `<!-- ueot-ai-signal:${eventKey} -->`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            if (comments.some((comment) => (comment.body || '').includes(marker))) {
              core.info(`Signal ${eventKey} already exists.`);
              return;
            }

            const lines = selected
              .map((check) => `- ${check.name}: ${check.conclusion}`)
              .sort();
            const body = [
              marker,
              '[UEOT-AI-SIGNAL]',
              'event: ci-settled',
              `event_key: ${eventKey}`,
              `task: ${state.task_id}`,
              `pr: ${prNumber}`,
              `sha: ${sha}`,
              `aggregate: ${aggregate}`,
              'required_checks:',
              ...lines,
              '',
              'External workers must re-read repository/PR/CI state, reject duplicate event keys,',
              'perform one bounded transition, checkpoint, and exit. This comment is a wake-up',
              'signal, not evidence that the implementation is correct.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body,
            });
