name: UEOT Core 3 Branch Hygiene

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually delete audited Core 3 legacy branches (false = dry run)"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "For apply=true, type DELETE_CORE3_LEGACY"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/core3-branch-hygiene.yml"

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: ueot-core3-branch-hygiene
  cancel-in-progress: false

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit and prune audited Core 3 legacy branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # This workflow is intentionally scoped to the one-time Core 3 legacy
          # cleanup family. It MUST NOT treat unrelated UEOT-GI / UEOT-QM / physics
          # branches as deletion candidates merely because they are not on a Core 3
          # keep-list.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            # The push trigger is limited by `paths` above, so this is the one-time
            # cleanup when this reviewed workflow itself lands on main.
            APPLY="true"
            CONFIRMATION="DELETE_CORE3_LEGACY"
          else
            APPLY="${{ inputs.apply }}"
            CONFIRMATION="${{ inputs.confirmation }}"
          fi

          if [[ "$APPLY" == "true" && "$CONFIRMATION" != "DELETE_CORE3_LEGACY" ]]; then
            echo "Refusing destructive cleanup: confirmation string is missing." >&2
            exit 1
          fi

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          # After source/coverage reconciliation, only P-QSD-03 remains worth
          # preserving as unique pending theorem work. The former QSDPerron branch
          # explicitly targets already-counted P-QSD-02; v3 metrics/dynamics/history
          # branches target families already counted; core/v3-maintenance contains
          # stale status docs. Those are therefore cleanup candidates.
          KEEP_EXACT=(
            "main"
            "formal/pqsd03-duration-window-v1"
          )

          mapfile -t OPEN_PR_HEADS < <(
            gh pr list --state open --limit 1000 --json headRefName --jq '.[].headRefName'
          )

          is_in_array() {
            local needle="$1"; shift
            local x
            for x in "$@"; do
              [[ "$x" == "$needle" ]] && return 0
            done
            return 1
          }

          # Only branches in this explicit legacy scope can be deleted by this
          # workflow. Unknown/new namespaces are always retained for manual audit.
          is_core3_legacy_candidate() {
            local branch="$1"
            [[ "$branch" == "master" ]] \
              || [[ "$branch" == "core/v3-maintenance" ]] \
              || [[ "$branch" == docs/* ]] \
              || [[ "$branch" == formal/* ]] \
              || [[ "$branch" == "ops/core3-branch-governance-v1" ]]
          }

          mapfile -t ALL_BRANCHES < <(
            git for-each-ref --format='%(refname:short)' refs/remotes/origin \
              | sed 's#^origin/##' \
              | grep -v '^HEAD$' \
              | sort -u
          )

          DELETE_BRANCHES=()
          KEEP_BRANCHES=()
          OUT_OF_SCOPE=()
          MANIFEST="$(mktemp)"

          {
            echo "### Core 3 branch-hygiene manifest — $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "- event: \`${GITHUB_EVENT_NAME}\`"
            echo "- main at workflow start: \`$(git rev-parse origin/main)\`"
            echo "- branch count before: **${#ALL_BRANCHES[@]}**"
            echo "- apply deletion: **${APPLY}**"
            echo "- destructive scope: audited Core 3 legacy `master`, `core/v3-maintenance`, `docs/*`, `formal/*`, and completed governance branch"
            echo
            echo "#### Audited deletion candidates"
          } > "$MANIFEST"

          for branch in "${ALL_BRANCHES[@]}"; do
            if is_in_array "$branch" "${KEEP_EXACT[@]}" \
              || [[ "$branch" == hold/* ]] \
              || is_in_array "$branch" "${OPEN_PR_HEADS[@]}"; then
              KEEP_BRANCHES+=("$branch")
              continue
            fi

            if ! is_core3_legacy_candidate "$branch"; then
              OUT_OF_SCOPE+=("$branch")
              continue
            fi

            sha="$(git rev-parse "origin/${branch}")"
            DELETE_BRANCHES+=("$branch")
            printf -- '- `%s` @ `%s`\n' "$branch" "$sha" >> "$MANIFEST"
          done

          {
            echo
            echo "#### Retained by explicit keep-set / open PR / hold"
            for branch in "${KEEP_BRANCHES[@]}"; do
              printf -- '- `%s` @ `%s`\n' "$branch" "$(git rev-parse "origin/${branch}")"
            done
            echo
            echo "#### Retained because outside this cleanup scope"
            if [[ ${#OUT_OF_SCOPE[@]} -eq 0 ]]; then
              echo "- none"
            else
              for branch in "${OUT_OF_SCOPE[@]}"; do
                printf -- '- `%s` @ `%s`\n' "$branch" "$(git rev-parse "origin/${branch}")"
              done
            fi
            echo
            echo "Deletion rule: no open PR, not active/retained, and branch must match the explicit audited Core 3 legacy scope. Exact pre-delete SHAs are recorded before mutation."
          } >> "$MANIFEST"

          gh issue comment 56 --body-file "$MANIFEST"

          if [[ "$APPLY" == "true" && ${#DELETE_BRANCHES[@]} -gt 0 ]]; then
            git push origin --delete "${DELETE_BRANCHES[@]}"
          fi

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t AFTER_BRANCHES < <(
            git for-each-ref --format='%(refname:short)' refs/remotes/origin \
              | sed 's#^origin/##' \
              | grep -v '^HEAD$' \
              | sort -u
          )

          SUMMARY="$(mktemp)"
          {
            echo "### Core 3 branch hygiene result"
            echo
            echo "- apply deletion: **${APPLY}**"
            echo "- deletion candidates: **${#DELETE_BRANCHES[@]}**"
            echo "- explicit retained/open-PR/hold before deletion: **${#KEEP_BRANCHES[@]}**"
            echo "- out-of-scope retained before deletion: **${#OUT_OF_SCOPE[@]}**"
            echo "- branch count after: **${#AFTER_BRANCHES[@]}**"
            echo
            echo "Remaining branches:"
            for branch in "${AFTER_BRANCHES[@]}"; do
              printf -- '- `%s`\n' "$branch"
            done
          } > "$SUMMARY"
          gh issue comment 56 --body-file "$SUMMARY"

          if [[ "$APPLY" == "true" && ${#AFTER_BRANCHES[@]} -gt 12 ]]; then
            echo "Branch count remains above the repository hard cap (12); a separate manual audit is required." >&2
            exit 1
          fi
