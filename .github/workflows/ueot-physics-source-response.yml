name: Finite source response research

on:
  pull_request:
    paths: &research_paths
      - 'physics/qm/null_source/**'
      - 'physics/qm/status/CURRENT.json'
      - 'formalization/ueot-core/UEOT/V3/Compression/TheoryCompletion/ScientificClosure/SISCFutureResponseCore.lean'
      - '.github/workflows/ueot-physics-source-response.yml'
  push:
    branches: [main]
    paths: *research_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install the same scientific dependencies
        run: python -m pip install numpy==2.5.4 scipy==1.18.1 sympy==1.14.0 mpmath==1.3.0
      - name: Reuse 67 predecessor results and verify correlated quantum-state residual bounds
        run: python -B physics/qm/null_source/timelike/correlated_static/run_verification.py --output "$RUNNER_TEMP/correlated-static-verification.json" --logs "$RUNNER_TEMP/correlated-static-logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correlated-static-research
          path: |
            ${{ runner.temp }}/correlated-static-verification.json
            ${{ runner.temp }}/correlated-static-logs/
          if-no-files-found: error
