name: Correlated bath and local field

on:
  push:
    branches: [main]
    paths:
      - "physics/qm/correlated_bath/**"
      - ".github/workflows/ueot-qm-correlated-bath.yml"
  pull_request:
    paths:
      - "physics/qm/correlated_bath/**"
      - ".github/workflows/ueot-qm-correlated-bath.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install the scientific dependencies
        run: python -m pip install numpy==2.5.4 scipy==1.18.1 mpmath==1.3.0 sympy==1.14.0
      - name: Reproduce source, calibration, complete outputs, cross-review and held-out decisions
        run: python -B physics/qm/correlated_bath/portable_replay.py --repo . --receipt "$RUNNER_TEMP/correlated-bath-replay.json"
      - name: Replay the finite oscillator comparison and rational output repair
        env:
          UEOT_UPSTREAM_REPO: ${{ github.workspace }}
          OPENBLAS_NUM_THREADS: 1
        run: python -B physics/qm/correlated_bath/dynamics/verify_dynamics.py --receipt "$RUNNER_TEMP/dynamics-replay.json"
      - name: Recompute the two field settings and sector comparisons
        run: python -B physics/qm/correlated_bath/verify_extensions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correlated-bath-replay
          path: |
            ${{ runner.temp }}/correlated-bath-replay.json
            ${{ runner.temp }}/dynamics-replay.json
          if-no-files-found: warn
