# Scope changes are documented in the 2026-11-13 core-claim-scope-reconciliation
# RFC and architect resolution. IDs remain stable; historical citations retain
# the wording of their cited revision. canonical does not mean proved.
claims:
  - id: core-001
    title: Persistence and Omega claims require a declared scope
    status: canonical
    statement: >
      Organizational self-regenerating feedback and operational minimal-failure
      Omega structures are distinct claims. Operational failure families may be
      empty, and their reconstruction retains the stated hypotheses. A universal
      self-regenerating loop is not an admission requirement for every Core model
      or every real existent; stronger domain claims require separate support.
  - id: core-002
    title: Objecthood is interpreted processually
    status: canonical
    statement: >
      UEOT interprets objects through formation, stabilization, relations, and
      change. This philosophical commitment is not a theorem identifying all real
      objects with one operational certificate. Predictive identity, formation
      provenance, interaction distinction, constitutive persistence,
      recoverable realization, and semantic identity have distinct contracts.
  - id: core-003
    title: Pi and Phi require typed qualitative or numerical use
    status: canonical
    statement: >
      Resource and informational organization are qualitative research concerns.
      A numerical Pi/Phi model must declare its response family, operational
      anchors, factorization, and applicable assumptions; no universal coupled
      optimization or common two-dimensional sufficient representation follows
      from the qualitative distinction.
  - id: core-004
    title: Functional purpose requires a mechanism and declared evaluation
    status: canonical
    statement: >
      UEOT seeks conditional naturalistic explanations of goal-directed
      functioning through mechanisms and their consequences. Supplied evaluation,
      internally realized function, reflective intention, and normative reason
      are distinct. Optimization alone proves neither a unique intrinsic purpose
      nor moral value; normative conclusions require additional premises.
  - id: core-005
    title: GOD and GOA require applicability and precise comparison conditions
    status: canonical
    statement: >
      Analyses must assess whether GOD and GOA are applicable. Directions or
      optimal actions depend on declared dynamics, feasibility, information,
      evaluation, and comparison class; long-run objects require an explicit type
      and hypotheses. Non-uniqueness, non-attainment, periodic behavior, or
      inapplicability must not be replaced by an assumed unique optimal attractor.
  - id: core-006
    title: Lifecycle staging is conditional
    status: canonical
    statement: >
      Emergence, maturation or optimization, and decay or dissolution are examined
      when supported by the phenomenon and contract. They are not mandatory
      phases of every legal model; static, cyclic, persistent, and transient
      systems retain their actual dynamical scope.
  - id: core-007
    title: Multiscale reasoning is required where applicable
    status: canonical
    statement: >
      UEOT explanations must handle sub-object, object, and super-object relations
      where the domain is inherently multiscale. Object-scale transport, process
      coarse-graining, and Wilsonian RG are not identified by name alone. Type I
      and Type II remain qualified profiles rather than an exhaustive binary
      classification or a universal feedback requirement.
  - id: method-001
    title: Domain extensions must be falsification-aware
    status: canonical
    statement: >
      Domain agents must produce research-actionable consequences, counterargument
      handling, and evidence targets rather than purely analogical language.
  - id: governance-001
    title: Only architect resolution can modify canon
    status: canonical
    statement: >
      Domain agents may propose changes, but only written architect resolutions
      under the constitutional change process can alter constitutional doctrine.
  - id: governance-002
    title: Epistemic layers do not inherit status
    status: canonical
    statement: >
      Constitutional commitment, mathematical proof, physical law, empirical
      support, normative justification, and publication status are distinct; no
      layer silently inherits the authority of another. canonical records an
      adopted commitment or rule with its scope, not mathematical proof.
  - id: method-002
    title: Core-to-physics bridges must be explicit
    status: canonical
    statement: >
      A physical result may be attributed to generic UEOT Core only after its
      bridge theorem and all sector-specific or standard physical inputs are
      declared. Structural similarity alone does not establish physical
      equivalence, empirical validity, or an applicable shared source.
  - id: governance-003
    title: Publications are theory snapshots
    status: canonical
    statement: >
      Papers and monographs preserve and communicate a theory state but do not
      override a newer approved Core specification, proof ledger, or architect
      resolution. Historical claim IDs retain the meaning of their cited
      revision; current use follows the explicitly reconciled scope.
